name: Supabase wach halten

# Kostenlose Supabase-Projekte werden nach ca. 7 Tagen ohne Aktivität pausiert.
# Dieser Job ruft alle 3 Tage die API des Projekts auf.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        run: |
          curl --fail --silent --show-error \
            -H "apikey: sb_publishable_34q-VKLGAcx2Q7sf0POzjw_r_Ym7Qnb" \
            https://ecfkknlmrjrzkgwnxucq.supabase.co/auth/v1/health
